# ============================================================
#  Veille logement — T1/T2 meublé, près d'une gare
#  92 (Courbevoie, Puteaux, Suresnes, Neuilly, Levallois…), Paris,
#  Bry-sur-Marne, Val de Fontenay, Eaubonne — particuliers ET agences
#  Modifie les valeurs, enregistre : c'est tout.
#  Les secrets (Telegram, clés) sont dans GitHub > Settings > Secrets.
# ============================================================

[recherche]
loyer_max = 900           # €/mois, charges comprises
loyer_min = 400           # écarte les parkings / annonces bidon
surface_min = 18          # m²
pieces_min = 1            # T1
pieces_max = 2            # T2
types_bien = ["flat", "loft"]
meuble = "oui"            # "oui" = meublé obligatoire · "non" · "indifferent"
exclure_rdc = true        # pas de rez-de-chaussée (sécurité)
mots_exclus = ["colocation", "coloc", "sous-location", "viager", "place de parking", "box fermé", "chambre chez l'habitant",
               "courte durée", "bail mobilité", "location saisonnière"]

[geo]
# Distance max (à vol d'oiseau) jusqu'à la gare / station la plus proche.
# 0,6 km ≈ 10 min à pied · 0,8 km ≈ 13 min · 1,0 km ≈ 16 min
distance_max_km = 0.8
departements = ["75", "92", "93", "94", "95"]
paris_arrondissements_exclus = [18, 19]
# Paris : seulement ces arrondissements (choisis sur la sécurité SSMSI + la distance SKEMA / Porte Maillot)
#  très bons (coup de cœur) : 15e, 16e, 17e — les plus tranquilles ET les plus proches de tes lieux
#  bons : 5e, 6e, 7e, 14e
paris_arrondissements = [5, 6, 7, 14, 15, 16, 17]
paris_coups_de_coeur = [15, 16, 17]
# Gares : toutes celles d'Île-de-France (données officielles IDFM, téléchargées
# automatiquement une fois par mois). Ajoute "TRAMWAY" si le tram te va.
modes = ["METRO", "RER", "TRAIN"]

# Communes où chercher. Supprime un bloc pour retirer une ville.
#  secteur : Bien'ici est interrogé secteur par secteur (Paris, très actif, ne noie pas le reste)
#  zone    : "commune" = toute la commune · "gare" = seulement près d'une gare
#  coup_de_coeur : petit bonus dans la note
