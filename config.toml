# Tes lieux du quotidien : temps de trajet calculé pour chaque annonce.
[[lieux]]
nom = "SKEMA"
adresse = "5 Quai Marcel Dassault, 92150 Suresnes"
[[lieux]]
nom = "Porte Maillot"
adresse = "Place de la Porte Maillot, 75017 Paris"

[securite]
# Statistiques officielles de la délinquance par commune (SSMSI, ministère de l'Intérieur).
# Chaque commune reçoit un niveau de 1 (moins tranquille) à 5 (plus tranquille)
# par rapport aux autres communes de Paris et de la petite couronne (75, 92, 93, 94).
actif = true
niveau_min = 1            # mets 3 pour ignorer les communes les moins tranquilles
# Zones à éviter : tu connais le coin mieux que les stats. Exemple :
# [[securite.zones_a_eviter]]
# nom = "rue X"
# lat = 48.90
# lon = 2.25
# rayon_m = 300
mots_rassurants = ["gardien", "digicode", "interphone", "visiophone", "résidence sécurisée", "résidence fermée",
                   "vidéosurveillance", "porte blindée", "badge"]

[score]
# Note /100 = prix (30) + sécurité (20) + trajets SKEMA/travail (20) + proximité gare (20) + surface (10)
# + bonus : commune coup de cœur (+4), particulier sans frais d'agence (+3)
prix_m2_reference = 30
seuil_bonne_affaire = 0.88
seuil_suspect = 0.60
mots_suspects = ["western union", "mandat cash", "transcash", "coupon pcs", "je suis à l'étranger",
                 "actuellement à l'étranger", "clés par la poste", "clés envoyées", "envoi des clés",
                 "airbnb", "sans visite", "pas de visite possible", "paiement avant visite"]

[sources.bienici]
actif = true
# Nombre de pages de 50 annonces (les plus récentes) par secteur et par passage
[sources.bienici.pages]
ouest = 3
paris = 4
est = 1

[sources.emails]
actif = false
imap_host = "imap.gmail.com"
dossier = "INBOX"
# Particuliers : pap.fr, leboncoin.fr, locservice.fr, entreparticuliers.com, paruvendu.fr
# Étudiants : studapart.com (partenaire de SKEMA), immojeune.com, lokaviz.fr (Crous)
# Meublés : lodgis.com, parisattitude.com, flatlooker.com · Agences : seloger, logic-immo, bienici…
expediteurs = ["leboncoin.fr", "seloger.com", "pap.fr", "logic-immo.com", "bienici.com", "avendrealouer.fr",
               "locservice.fr", "entreparticuliers.com", "paruvendu.fr", "studapart.com", "immojeune.com",
               "lokaviz.fr", "lodgis.com", "parisattitude.com", "flatlooker.com", "housinganywhere.com",
               "spotahome.com", "century21.fr", "orpi.com", "laforet.com", "foncia.com", "nexity.fr", "guy-hoquet.com"]
# Sites d'annonces entre particuliers (badge « Particulier · pas de frais d'agence »)
sites_particuliers = ["pap.fr", "locservice.fr", "entreparticuliers.com"]
liens_max_par_mail = 15
# true = une annonce reçue par mail n'est gardée que si elle cite une de tes villes
communes_strictes = true

[notifications]
telegram = true
ntfy = false
notifier_existant_au_premier_lancement = false
score_min = 0                 # ne notifier qu'au-dessus de cette note (0 = tout)
bilan_quotidien_heure = 20    # récap du jour à 20h ; -1 pour désactiver

[candidature]
# Ton lien DossierFacile (dossier de location gratuit de l'État, à créer sur
# dossierfacile.logement.gouv.fr). Il est ajouté à ton message type pour les agences.
lien_dossier = ""
