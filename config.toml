# Tes lieux du quotidien : temps de trajet calculé pour chaque annonce.
[[lieux]]
nom = "SKEMA"
adresse = "5 Quai Marcel Dassault, 92150 Suresnes"
[[lieux]]
nom = "Porte Maillot"
adresse = "Place de la Porte Maillot, 75017 Paris"

[securite]
# Statistiques officielles de la délinquance par commune (SSMSI, ministère de l'Intérieur).
# Chaque commune reçoit un niveau de 1 (moins tranquille) à 5 (plus tranquille)
# par rapport aux autres communes de Paris et de la petite couronne (75, 92, 93, 94).
actif = true
niveau_min = 1            # mets 3 pour ignorer les communes les moins tranquilles
# Zones à éviter : tu connais le coin mieux que les stats. Exemple :
# [[securite.zones_a_eviter]]
# nom = "rue X"
# lat = 48.90
# lon = 2.25
# rayon_m = 300
mots_rassurants = ["gardien", "digicode", "interphone", "visiophone", "résidence sécurisée", "résidence fermée",
                   "vidéosurveillance", "porte blindée", "badge"]

[score]
# Note /100 = prix (30) + sécurité (20) + trajets SKEMA/travail (20) + proximité gare (20) + surface (10)
# Sans clé PRIM, la note « trajets » utilise la distance à vol d'oiseau vers SKEMA et Porte Maillot.
# + bonus : commune coup de cœur (+4), particulier sans frais d'agence (+3)
prix_m2_reference = 30
seuil_bonne_affaire = 0.88
seuil_suspect = 0.60
mots_suspects = ["western union", "mandat cash", "transcash", "coupon pcs", "je suis à l'étranger",
                 "actuellement à l'étranger", "clés par la poste", "clés envoyées", "envoi des clés",
                 "airbnb", "sans visite", "pas de visite possible", "paiement avant visite"]

[sources.bienici]
actif = true
# Nombre de pages de 50 annonces (les plus récentes) par secteur et par passage
[sources.bienici.pages]
