name: Veille logement

on:
  schedule:
    # Toutes les 10 min de 6h à minuit (heure de Paris, hiver = UTC+1), décalé des heures pile
    # (GitHub saute souvent les lancements à :00). Pour une fréquence garantie : voir README, « cron-job.org ».
    - cron: "4,14,24,34,44,54 5-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veille-logement
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chercher les nouvelles annonces
        run: |
          export DASHBOARD_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}

      - name: Enregistrer la mémoire et le site
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "maj annonces"
            git pull --rebase --quiet || true
            git push
          fi
